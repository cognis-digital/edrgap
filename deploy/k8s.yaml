apiVersion: apps/v1
kind: Deployment
metadata: { name: edrgap, labels: { app: edrgap } }
spec:
  replicas: 1
  selector: { matchLabels: { app: edrgap } }
  template:
    metadata: { labels: { app: edrgap } }
    spec:
      containers:
        - name: edrgap
          image: ghcr.io/cognis-digital/edrgap:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: edrgap }
spec:
  selector: { app: edrgap }
  ports: [{ port: 80, targetPort: 8000 }]
